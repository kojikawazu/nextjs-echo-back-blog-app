name: Build and Deploy to Artifact Registry and Cloud Run

on:
    push:
      branches:
        - main
      paths:
        - 'backend/**/*.go'
        - '!backend/**/*_test.go'
        - 'backend/go.mod'
        - 'backend/go.sum'
        - 'backend/Dockerfile'
        - '.github/workflows/**'

# id-token: write は Workload Identity Federation で GitHub の OIDC トークンを発行するため（#144）
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 長期有効なサービスアカウントキーは使わず、Workload Identity Federation でデプロイ専用 SA を借用する（#144）。
      # Provider の条件で、このリポジトリの main ブランチの deploy.yml からのトークンだけを受け入れる（terraform/github-actions-wif.tf）。
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Authenticate Docker with GCR
        run: |
            gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
            project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build and push Docker image
        run: |
            IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }}"
            docker build -t ${IMAGE}:${{ github.sha }}  ./backend
            docker push ${IMAGE}:${{ github.sha }}

      # バックエンドは BFF（フロントエンドのサービスアカウント）からのみ呼べるようにする（ID トークンのない呼び出しは Cloud Run が 403 で拒否する）。
      # --no-allow-unauthenticated は allUsers のバインディングを外すだけで、invoker の IAM チェック自体が無効（invoker-iam-disabled）だと
      # 誰でも呼べてしまう。--invoker-iam-check で毎回 IAM チェックを有効にする（#165）。
      # BFF が転送する X-Client-IP は、非公開であることを前提に信頼するため、これらの設定は必ず同じコマンドで揃えて変更する（#146）。
      - name: Deploy to Cloud Run
        run: |
            gcloud run deploy ${{ secrets.GCP_CLOUD_RUN_SERVICE_NAME }} \
              --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }}:${{ github.sha }}  \
              --region ${{ secrets.GCP_REGION }} \
              --platform managed \
              --max-instances 3 \
              --no-allow-unauthenticated \
              --invoker-iam-check \
              --update-env-vars TRUST_CLIENT_IP_HEADER=true

      # 最新 5 件を残して古いイメージを削除する。イメージはコミット SHA のタグ付きのため --delete-tags が必要
      # （タグ付きのまま digest で削除すると失敗する）。削除権限（artifactregistry.versions.delete）は
      # デプロイ SA にリポジトリ単位の repoAdmin で付与している（#144。以前の SA は writer のみで、毎回権限エラーになっていた）。
      # 削除に失敗してもデプロイ自体は成功しているため、ジョブは失敗させず警告として残す。
      - name: Cleanup old images
        run: |
            IMAGE_NAME="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }}"

            echo "Cleaning up old images..."
            gcloud artifacts docker images list ${IMAGE_NAME} --format="value(DIGEST)" --sort-by="~UPDATE_TIME" | tail -n +6 | while read -r DIGEST; do
                if [[ ! -z "${DIGEST}" ]]; then
                    echo "Deleting old image: ${IMAGE_NAME}@${DIGEST}"
                    gcloud artifacts docker images delete "$IMAGE_NAME@$DIGEST" --delete-tags --quiet || echo "::warning::Failed to delete $IMAGE_NAME@$DIGEST"
                fi
            done

            echo "Cleanup completed"
