name: Build and Deploy to Artifact Registry and Cloud Run

on:
    push:
      branches:
        - main
      paths:
        - '**/*.go'
        - '!**/*_test.go'
        - 'go.mod'
        - 'go.sum'
        - 'Dockerfile'
        - '.github/workflows/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests (handlers & services)
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: go test ./handlers/... ./services/...

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Authenticate Docker with GCR
        run: |
            gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
            project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build and push Docker image
        run: |
            IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }}"
            docker build -t ${IMAGE}:${{ github.sha }}  .
            docker push ${IMAGE}:${{ github.sha }} 

      - name: Deploy to Cloud Run
        run: |
            gcloud run deploy ${{ secrets.GCP_CLOUD_RUN_SERVICE_NAME }} \
              --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }}:${{ github.sha }}  \
              --region ${{ secrets.GCP_REGION }} \
              --platform managed \
              --allow-unauthenticated

      - name: Cleanup old images
        run: |
            IMAGE_NAME="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }}"
            
            # 古いイメージの削除（参照されていないもののみ）
            echo "Cleaning up old images..."
            gcloud artifacts docker images list ${IMAGE_NAME} --format="value(DIGEST)" --sort-by="~UPDATE_TIME" | tail -n +6 | while read -r DIGEST; do
                if [[ ! -z "${DIGEST}" ]]; then
                    echo "Attempting to delete old image: ${IMAGE_NAME}@${DIGEST}"
                    gcloud artifacts docker images delete "$IMAGE_NAME@$DIGEST" --quiet || echo "Failed to delete $IMAGE_NAME@$DIGEST (likely referenced by other manifests)"
                fi
            done
            
            echo "Cleanup completed (some images may remain if referenced by other manifests)"