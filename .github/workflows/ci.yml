name: CI

# lint / 静的解析。PR と main への push で実行し、マージ前に品質を担保する。
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: gofmt (format check)
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下のファイルが未フォーマットです。'gofmt -w .' を実行してください:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: backend

  # ユニットテスト。全 mock の handlers / services のみ実行し、DB を必要としない。
  # 実 DB 接続が必要な repositories 層（IT）は CI では実行しない。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: go test (handlers & services / all mock, no DB)
        working-directory: backend
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: go test ./handlers/... ./services/...

  # インテグレーションテスト（IT）。repositories 層を testcontainers 上の
  # 使い捨て PostgreSQL に対して実行する（実 Supabase には接続しない）。
  # GitHub Actions の ubuntu ランナーは Docker 同梱のため追加設定は不要。
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: go test (repositories / testcontainers)
        working-directory: backend
        # SUPABASE_URL は設定しない → testsupport がコンテナを起動する。
        run: go test -tags=integration ./repositories/...

  # E2E テスト。httptest で起動した実サーバー（全ルート）へ HTTP を投げ、
  # Handler → Service → Repository → DB を貫くフローを検証する。
  # DB は testcontainers の使い捨て PostgreSQL を再利用する。
  # config パッケージが起動時に JWT_SECRET_KEY を要求するため env で注入する。
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: go test (e2e / testcontainers)
        working-directory: backend
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        # SUPABASE_URL は設定しない → testsupport がコンテナを起動する。
        run: go test -tags=e2e ./e2e/...
