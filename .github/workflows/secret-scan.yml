# 鍵・.env・Terraform の state / 変数などの秘匿ファイルが Git 管理下に入っていないことを検証する（#126）。
# 既存の CI（ci.yml）とは発火条件も実行内容も別物のため独立させる。
name: secret-scan

# パスフィルタはかけない。秘匿ファイルはどの種別の変更にも混入し得るうえ
# （ci.yml は backend/** に絞っており、ルートや terraform/ への混入では起動しない）、
# git ls-files はインデックスを読むだけで数秒で終わる。必須チェックにした際に
# パスフィルタの設計を誤ると PR がマージ不能になるため（起動しないワークフローの
# 必須チェックは pending のまま完了しない）。常時起動ならその余地が無い。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # 検査対象を git ls-files から引くため、checkout を先に置く
      - uses: actions/checkout@v7

      # 検出ルールの退行を、実スキャンの前に検知する
      - name: Test detection rules
        run: ./scripts/check-secret-files_test.sh

      # 検出パターンは scripts/ の 1 箇所に定義し、CI もローカルもそれを実行する
      # （手順を CI とローカルに書き分けると、必ずどちらかが腐る）
      - name: Assert no secret files are tracked
        run: ./scripts/check-secret-files.sh
